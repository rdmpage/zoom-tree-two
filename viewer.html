<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>zoom-tree-two</title>
<style>
	html, body
	{
		margin: 0;
		padding: 0;
		height: 100%;
		font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
		font-size: 11px;
		color: #222;
	}

	#navbar
	{
		position: absolute;
		top: 0; left: 0; right: 0;
		height: 40px;
		display: flex;
		align-items: center;
		gap: 12px;
		padding: 0 12px;
		background: #fff;
		border-bottom: 1px solid #ddd;
		box-sizing: border-box;
		z-index: 10;
	}

	#navbar .title
	{
		font-weight: 600;
		font-size: 12px;
		color: #444;
		white-space: nowrap;
	}

	#search
	{
		flex: 0 1 280px;
		height: 26px;
		padding: 0 8px;
		font-size: 12px;
		border: 1px solid #aaa;
		border-radius: 4px;
		outline: none;
	}

	#search:focus      { border-color: #66a; }
	#search.no-match   { border-color: #c33; background: #fff0f0; }

	#nav-status
	{
		margin-left: auto;
		font-size: 11px;
		color: #888;
		font-variant-numeric: tabular-nums;
	}

	#zoom-controls
	{
		display: flex;
		gap: 4px;
	}

	#zoom-controls button
	{
		width: 28px;
		height: 28px;
		padding: 0;
		border: 1px solid #aaa;
		background: #fff;
		font-size: 16px;
		line-height: 1;
		cursor: pointer;
		border-radius: 4px;
		display: inline-flex;
		align-items: center;
		justify-content: center;
	}

	#zoom-controls button:disabled
	{
		color: #ccc;
		cursor: default;
	}

	#viewer
	{
		position: absolute;
		top: 40px;
		left: 0; right: 0; bottom: 0;
		overflow: auto;
		background: #fff;
		user-select: none;
		-webkit-user-select: none;
	}

	#pages
	{
		position: relative;
		width: max-content;
	}

	.page
	{
		position: relative;
		width: 100%;
		box-sizing: border-box;
	}

	.row
	{
		width: 100%;
		overflow: visible;
		box-sizing: border-box;
		transition: background-color 1.2s ease-out;
	}

	.row.highlight    { background: #ffe680; transition: none; }

	/* Clade-block layer (prototype) — painted behind the row glyphs. */
	.block-layer
	{
		position: absolute;
		top: 0; left: 0;
		width: 100%; height: 100%;
		pointer-events: none;
	}
	.clade-block
	{
		position: absolute;
		left: 0; right: 0;
		box-sizing: border-box;
	}
	.clade-name
	{
		position: absolute;
		right: 12px;
		transform: translateY(-50%);
		white-space: nowrap;
		font-weight: 400;
		font-size: 15px;
		color: rgba(20, 20, 20, 0.7);
	}
	#pages.blocks-hidden .block-layer { display: none; }

	.row svg          { display: block; }
	.row svg path     { stroke: #222; stroke-width: 1; fill: none; shape-rendering: crispEdges; }
	.row svg .g-dot   { fill: #222; stroke: none; }
	.row svg .g-circle{ fill: #fff; stroke: #222; stroke-width: 1; }
	.row svg .g-tri   { fill: #d6d6d6; stroke: #555; stroke-width: 1; }
	.row svg text     { font-family: -apple-system, "Helvetica Neue", sans-serif; font-size: 11px; dominant-baseline: middle; fill: #222; }
	.row svg .g-internal { fill: #222; }
	.row svg .g-closed   { fill: #222; }
	.row svg .g-support  { fill: #888; font-size: 9px; }
</style>
</head>
<body>

<div id="navbar">
	<span class="title">zoom-tree</span>
	<input id="search" type="text" placeholder="Search labels…" autocomplete="off" spellcheck="false" autocapitalize="off">
	<span id="nav-status">loading…</span>
	<div id="zoom-controls">
		<button id="zoom-out" type="button" title="Zoom out (−)">&minus;</button>
		<button id="zoom-in"  type="button" title="Zoom in (+)">+</button>
	</div>
</div>

<div id="viewer">
	<div id="pages"></div>
</div>

<script src="src/js/glyph.js"></script>
<script src="src/js/viewer.js"></script>
<script>
	(function ()
	{
		var params = new URLSearchParams(window.location.search);
		var id = params.get('id') || '62057be74ac6';  // default = gekkota for dev convenience

		var status  = document.getElementById('nav-status');
		var btnIn   = document.getElementById('zoom-in');
		var btnOut  = document.getElementById('zoom-out');
		var search  = document.getElementById('search');

		fetch('trees/' + id + '.json')
			.then(function (r)
			{
				if (!r.ok) { throw new Error('HTTP ' + r.status); }
				return r.json();
			})
			.then(function (tree)
			{
				var viewer = new PageViewer({
					tree:    tree,
					viewer:  document.getElementById('viewer'),
					pages:   document.getElementById('pages'),
					zoom:    tree.config.min_zoom,   // placeholder — pickInitialZoom overrides
					onChange: function (v)
					{
						status.textContent =
							'n=' + v.visibleIds.length + '/' + tree.n +
							'   z=' + v.zoom + '/' + tree.config.max_zoom;
						btnIn.disabled  = (v.zoom >= tree.config.max_zoom);
						btnOut.disabled = (v.zoom <= tree.config.min_zoom);
					}
				});

				// Land on the largest zoom that still fits in the viewer, unless
				// an explicit ?z= override is given (dev/share convenience).
				var zParam = parseInt(params.get('z'), 10);
				viewer.zoom = isNaN(zParam) ? viewer.pickInitialZoom() : zParam;
				viewer.render();

				btnIn.addEventListener('click',  function () { viewer.setZoom(viewer.zoom + 1); });
				btnOut.addEventListener('click', function () { viewer.setZoom(viewer.zoom - 1); });

				search.addEventListener('keydown', function (e)
				{
					if (e.key !== 'Enter') { return; }
					var q = search.value.trim();
					if (!q) { return; }
					var found = viewer.searchByLabel(q);
					if (found === -1)
					{
						search.classList.add('no-match');
						setTimeout(function () { search.classList.remove('no-match'); }, 1200);
					}
					else
					{
						search.classList.remove('no-match');
						viewer.scrollToNode(found);
					}
				});
			})
			.catch(function (e)
			{
				status.textContent = 'error: ' + e.message;
			});
	})();
</script>

</body>
</html>
